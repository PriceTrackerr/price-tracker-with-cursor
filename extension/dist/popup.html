<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriceHawk</title>
    <link rel="stylesheet" href="./popup.css">
    <style>
        body {
            width: 384px;
            min-width: 384px;
            max-width: 400px;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
    </style>
</head>
<body>
    <div class="popup-container">
        <!-- Enhanced Header -->
        <div class="popup-header">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo-container">
                        <div class="logo-icon">
                            <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="0" y="0" width="100" height="100" rx="20" fill="#2563EB"/>
                                <path d="M25 70 C35 50, 65 50, 75 30" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                                <circle cx="75" cy="30" r="6" fill="white"/>
                            </svg>
                        </div>
                        <div class="status-indicator">
                            <span class="status-dot"></span>
                        </div>
                    </div>
                    <div class="brand-info">
                        <h1 class="brand-title">Price Tracker</h1>
                        <p class="brand-subtitle">Smart Price Tracking</p>
                    </div>
                </div>
                <div class="pro-badge">
                    <span class="badge-icon">✨</span>
                    <span class="badge-text">Pro</span>
                </div>
                <button id="refreshData" class="refresh-btn" title="Refresh Data">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                        <path d="M21 3v5h-5"></path>
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                        <path d="M3 21v-5h5"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Enhanced Stats Section -->
        <div class="stats-section">
            <div class="stats-grid">
                <!-- Tracked Products -->
                <div class="stat-card products-card">
                    <div class="stat-icon products-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="22,12 18,12 15,21 9,3 6,12 2,12"></polyline>
                        </svg>
                    </div>
                    <div class="stat-number">0</div>
                    <div class="stat-label">Products</div>
                </div>

                <!-- Active Alerts -->
                <div class="stat-card alerts-card">
                    <div class="stat-icon alerts-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
                            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
                        </svg>
                    </div>
                    <div class="stat-number">0</div>
                    <div class="stat-label">Alerts</div>
                </div>

                <!-- Total Saved -->
                <div class="stat-card saved-card">
                    <div class="stat-icon saved-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="1" x2="12" y2="23"></line>
                            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                        </svg>
                    </div>
                    <div class="stat-number">$0.00</div>
                    <div class="stat-label">Saved</div>
                </div>
            </div>
        </div>

        <!-- Enhanced Action Buttons -->
        <div class="action-section">
            <button id="trackProduct" class="btn btn-primary">
                <div class="btn-content">
                    <div class="btn-icon-container">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </div>
                    <span class="btn-text">Track This Product</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-arrow">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12,5 19,12 12,19"></polyline>
                    </svg>
                </div>
            </button>
            
            <button id="openDashboard" class="btn btn-secondary">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                    <polyline points="15,3 21,3 21,9"></polyline>
                    <line x1="10" y1="14" x2="21" y2="3"></line>
                </svg>
                <span class="btn-text">Open Dashboard</span>
            </button>
            

        </div>

        <!-- Enhanced Recent Products -->
        <div class="recent-section">
            <div class="section-header">
                <div class="section-title">
                    <h3>Recent Tracks</h3>
                    <p class="section-subtitle">Last tracked items</p>
                </div>
                <button class="view-all-btn">
                    <span>View All</span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12,5 19,12 12,19"></polyline>
                    </svg>
                </button>
            </div>
            
            <div class="products-list">
                <!-- Products will be populated by JavaScript -->
            </div>
        </div>

        <!-- Footer -->
        <div class="popup-footer">
            <button class="footer-btn">
                <span>Settings & Preferences</span>
            </button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <p>Loading...</p>
    </div>

    <script src="./popup.js"></script>
</body>
</html>
